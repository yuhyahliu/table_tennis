# Builds the Android app in android/ and publishes the APK as the "android-latest" release,
# so the phone can always download https://github.com/<owner>/<repo>/releases/latest/download/tt-coach.apk
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download pose models
        run: |
          mkdir -p app/src/main/assets
          for m in lite full; do
            curl -fsSL -o app/src/main/assets/pose_landmarker_$m.task \
              https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_$m/float16/1/pose_landmarker_$m.task
          done
          ls -la app/src/main/assets
      - name: Signing key
        env:
          KS: ${{ secrets.TT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/tt.jks"; echo "TT_KEYSTORE=$RUNNER_TEMP/tt.jks" >> "$GITHUB_ENV"; else echo "no keystore secret: using a throwaway debug key"; fi
      - name: Unit tests and APK
        env:
          TT_KEYSTORE_PASS: ${{ secrets.TT_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publish failure log to the ci-logs branch
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          grep -E "^e: |error:|FAILED|Exception|What went wrong|> Task.*FAILED|expected|Assert" -A3 "$RUNNER_TEMP/build.log" | head -400 > errors.txt || true
          tail -300 "$RUNNER_TEMP/build.log" > tail.txt
          git init -q -b ci-logs && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "build ${{ github.run_number }} failed"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/tt-coach.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tt-coach-apk
          path: ${{ runner.temp }}/tt-coach.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest "$RUNNER_TEMP/tt-coach.apk" \
            --title "場邊教練 Android #${{ github.run_number }}" \
            --notes "自動編譯（commit ${{ github.sha }}）。在 Pixel 上用 Chrome 下載 tt-coach.apk 後安裝。" \
            --target "${{ github.sha }}" --latest
