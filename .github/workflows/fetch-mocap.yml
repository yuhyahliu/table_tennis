# Inspects the CC BY 4.0 "Table Tennis MOCAP Dataset" (figshare 31746358, Jun Zhang, TTMD6:
# forehand/backhand attack, drive, push; infrared motion capture) and stores a summary + a compact copy
# on the data-mocap branch (large raw files are not committed).
name: Fetch MOCAP dataset
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'inspect = tree + samples only; convert = also compact numeric copy'
        default: inspect
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and extract
        run: |
          sudo apt-get install -y -qq p7zip-full p7zip-rar unrar >/dev/null 2>&1 || sudo apt-get install -y -qq p7zip-full >/dev/null
          pip install -q requests python-docx pandas openpyxl numpy
          python - <<'PY'
          import requests, json
          art = requests.get('https://api.figshare.com/v2/articles/31746358', timeout=60).json()
          json.dump({k: art.get(k) for k in ['title','doi','license','authors','description','published_date','citation']}, open('META.json','w'), ensure_ascii=False, indent=1)
          for f in art['files']:
              with requests.get(f['download_url'], stream=True, timeout=600) as r:
                  with open(f['name'], 'wb') as o:
                      for ch in r.iter_content(1 << 20): o.write(ch)
              print(f['name'], f['size'])
          PY
          mkdir -p raw && (unrar x -o+ -inul TTMD6.rar raw/ || 7z x -y -oraw TTMD6.rar >/dev/null)
          du -sh raw; find raw -type f | head -5
      - name: Summarise
        run: |
          mkdir -p out && cp META.json out/
          python - <<'PY'
          import os, docx, collections
          lines = []
          try:
              d = docx.Document('Dataset Description.docx')
              lines.append('=== Dataset Description.docx ===')
              lines += [p.text for p in d.paragraphs if p.text.strip()]
              for t in d.tables:
                  for row in t.rows: lines.append(' | '.join(c.text for c in row.cells))
          except Exception as e: lines.append(f'docx error {e}')
          lines.append('=== tree (dirs with file counts, extensions) ===')
          ext = collections.Counter()
          for root, dirs, files in os.walk('raw'):
              if files: lines.append(f"{root}: {len(files)} files, e.g. {sorted(files)[:3]}")
              for f in files: ext[os.path.splitext(f)[1]] += 1
          lines.append(f'extensions: {dict(ext)}')
          shown = 0
          for root, dirs, files in os.walk('raw'):
              for f in sorted(files)[:1]:
                  if shown >= 6: break
                  p = os.path.join(root, f); shown += 1
                  lines.append(f'=== head of {p} ({os.path.getsize(p)} bytes) ===')
                  try:
                      with open(p, 'r', errors='replace') as fh: lines += [next(fh).rstrip()[:400] for _ in range(12)]
                  except StopIteration: pass
                  except Exception as e: lines.append(f'binary? {e}')
          open('out/SUMMARY.txt', 'w').write('\n'.join(lines))
          print('\n'.join(lines[:150]))
          PY
      - name: Compact copy
        if: github.event.inputs.stage == 'convert'
        run: |
          cd raw && tar czf ../out/ttmd6_text.tgz $(find . -type f \( -name '*.csv' -o -name '*.txt' -o -name '*.trc' \) | head -20000) || true
          ls -la ../out
      - name: Push to data-mocap branch
        run: |
          cd out
          printf '%s\n' 'Data: "Table Tennis MOCAP Dataset" (TTMD6) by Jun Zhang, figshare 31746358, CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).' > README.md
          find . -size +95M -print -delete
          git init -q -b data-mocap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "TTMD6 (CC BY 4.0) summary"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-mocap
