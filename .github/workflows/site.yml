# Publishes GitHub Pages: the web app (tt-coach/) + the latest Android APK, served from Pages' CDN,
# which downloads much faster than GitHub release assets on some networks.
#   https://<owner>.github.io/<repo>/tt-coach/      web app
#   https://<owner>.github.io/<repo>/tt-coach.apk   Android app
name: Deploy site
on:
  push:
    branches: [main]
    paths: ['tt-coach/**', '.github/workflows/site.yml']
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site && cp -r tt-coach site/tt-coach
          gh release download android-latest -p tt-coach.apk -D site || echo "no APK release yet"
          ls -la site
          SIZE=$(du -m site/tt-coach.apk 2>/dev/null | cut -f1)
          cat > site/index.html <<HTML
          <!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>場邊教練</title><style>body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#0b1210;color:#e8f0ec;max-width:560px;margin:auto;padding:28px 18px;line-height:1.6}
          a.b{display:block;padding:18px;margin:14px 0;border-radius:14px;text-align:center;font-size:20px;text-decoration:none;font-weight:700}
          .a{background:#34d399;color:#052e1c}.w{background:#121c19;color:#e8f0ec;border:1px solid #24332e}small{color:#8fa39b}</style></head><body>
          <h1>場邊教練</h1>
          <a class="b a" href="tt-coach.apk">下載 Android App（${SIZE:-?} MB）</a>
          <a class="b w" href="tt-coach/">打開網頁版</a>
          <small>Android：下載後點通知安裝，第一次要允許 Chrome 安裝不明應用程式。更新時重新下載安裝即可，設定會保留。<br>
          空拍模式的標準正手來自 Table Tennis Forehand Stroke Mediapipe Datasets（LyuLyu, figshare, CC BY 4.0）。</small>
          </body></html>
          HTML
          sed -i 's/^          //' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
